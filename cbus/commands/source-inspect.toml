version = 1
command = "packages.source.inspect"
program = "the8020/packages/source-inspect"
summary = "Inspect package source"
usage = "<source-url> [--secret <name>]"
mutates_state = false
restart_behavior = "none"
[[examples]]
command = "packages.source.inspect https://github.com/the8020/uui.git"
[[examples]]
command = "packages.source.inspect https://gitlab.example.com/group/team/private.git --secret gitlab"

version = 1
program = "index-set"
summary = "Set desired package source and version"
usage = "<package-id> [--source <url>] [--commit <commit> | --tag <tag>] [--local] [--secret <name>]"
mutates_state = true
restart_behavior = "none"
[[examples]]
command = "packages.index.set the8020/uui --source https://github.com/the8020/uui.git"

version = 1
command = "packages.repository.init"
program = "repository-init"
summary = "Initialize a package repository"
usage = "<package-id> [--author-name <name>] [--author-email <email>] [--message <message>]"
mutates_state = true
restart_behavior = "none"
[[examples]]
command = "packages.repository.init acme/example"

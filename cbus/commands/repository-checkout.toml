version = 1
command = "packages.repository.checkout"
program = "the8020/packages/repository-checkout"
summary = "Check out a package branch or commit"
usage = "<package-id> [--branch <name> | --commit <commit>]"
mutates_state = true
restart_behavior = "none"
[[examples]]
command = "packages.repository.checkout the8020/uui --branch main"
